<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文档查看</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;
  font:15px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 0 16px;
  border-bottom:1px solid #30363d;margin-bottom:22px;flex-wrap:wrap}
.nav a{color:#58a6ff;text-decoration:none;font-size:13px}
.nav .sep{color:#484f58}
.nav .hits{color:#7d8590;font-size:12px;white-space:nowrap}
.nav .hits b{color:#58a6ff;font-weight:600}
h1,h2,h3,h4{line-height:1.3;margin:1.6em 0 .6em;font-weight:600}
h1{font-size:1.7em;border-bottom:1px solid #30363d;padding-bottom:.3em}
h2{font-size:1.35em;border-bottom:1px solid #21262d;padding-bottom:.25em}
h3{font-size:1.1em}
a{color:#58a6ff}
img{max-width:100%;height:auto;border-radius:6px;margin:12px 0}
code{background:#161b22;padding:.15em .4em;border-radius:4px;font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
pre{background:#161b22;padding:14px;border-radius:8px;overflow-x:auto;
  border:1px solid #30363d}
pre code{background:none;padding:0;font-size:.88em}
blockquote{margin:1em 0;padding:.6em 1em;border-left:3px solid #1f6feb;
  background:#161b22;border-radius:0 6px 6px 0;color:#b1bac4}
blockquote p{margin:.3em 0}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.94em;
  display:block;overflow-x:auto}
th,td{border:1px solid #30363d;padding:8px 12px;text-align:left}
th{background:#161b22;font-weight:600}
tr:nth-child(2n){background:#0f141b}
hr{border:0;border-top:1px solid #30363d;margin:2em 0}
ul,ol{padding-left:1.6em}
li{margin:.25em 0}
#loading{color:#7d8590;text-align:center;padding:50px 0}
.err{color:#f85149;background:#1c1210;border:1px solid #f8514940;
  padding:14px;border-radius:8px}
</style></head>
<body><div class="wrap" id="app"><div id="loading">加载中…</div></div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function safeUrl(u){
  const t=String(u).trim();
  if(/^\s*(javascript|data|vbscript|file):/i.test(t)) return '#';
  if(/^\s*(https?:|mailto:|tel:|\/|\.\/|\.\.\/|#)/i.test(t)) return t;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(t)) return t;
  return '#';
}
function inline(s){
  const codes=[]; s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000';});
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,(m,alt,src)=>'<img alt="'+esc(alt)+'" src="'+esc(safeUrl(src))+'">');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>'<a href="'+esc(safeUrl(u))+'" target="_blank" rel="noopener noreferrer">'+t+'</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+esc(codes[+i])+'</code>');
  return s;
}
function render(md){
  const lines=md.replace(/\r\n?/g,'\n').split('\n');
  let out=[],i=0;
  while(i<lines.length){
    let L=lines[i];
    if(/^```/.test(L)){
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue;
    }
    let h=L.match(/^(#{1,6})\s+(.*)$/);
    if(h){const n=h[1].length;out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');i++;continue;}
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(L)){out.push('<hr>');i++;continue;}
    if(/^>\s?/.test(L)){
      const buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,''));i++;}
      out.push('<blockquote>'+render(buf.join('\n'))+'</blockquote>');continue;
    }
    if(/^\s*\|/.test(L) && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(L); i+=2;
      let t='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      while(i<lines.length && /^\s*\|/.test(lines[i])){
        t+='<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; i++;
      }
      out.push(t+'</tbody></table>');continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(L)){
      const ordered=/^\s*\d+\./.test(L);
      let t=ordered?'<ol>':'<ul>';
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        t+='<li>'+inline(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,''))+'</li>'; i++;
      }
      out.push(t+(ordered?'</ol>':'</ul>'));continue;
    }
    if(/^\s*$/.test(L)){i++;continue;}
    const buf=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|>|\s*\||\s*([-*+]|\d+\.)\s)/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    if(buf.length) out.push('<p>'+inline(buf.join(' '))+'</p>');
    else {i++;}
  }
  return out.join('\n');
}
const FILE = 'README.md';

(async function(){
  const app=document.getElementById('app');
  const nav='<div class="nav"><a href="./">← 主页</a><span class="sep">|</span>'+
            '<span style="color:#7d8590;font-size:13px">'+esc(FILE)+'</span>'+
            '<span style="flex:1"></span>'+
            '<span class="hits">访问 <b id="hitn">—</b> 次</span></div>';
  try{
    const r = await fetch(FILE + '?raw=1', {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const md = await r.text();
    app.innerHTML = nav + '<div id="doc">' + render(md) + '</div>';
    const t = md.match(/^#\s+(.+)$/m);
    document.title = t ? t[1].trim() : '文档查看';
  }catch(e){
    app.innerHTML = nav + '<div class="err">加载失败：' + esc(e.message) + '</div>';
    document.title = '文档查看';
  }
  fetch('/api/count',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ const e=document.getElementById('hitn'); if(!e)return;
      if(d&&typeof d.count==='number') e.textContent=d.count.toLocaleString();
      else e.parentNode.style.display='none'; })
    .catch(()=>{ const e=document.getElementById('hitn'); if(e) e.parentNode.style.display='none'; });
})();
</script></body></html>
