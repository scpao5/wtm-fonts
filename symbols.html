function copyText(t){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t).catch(()=>fb(t));
  return fb(t);
}
function fb(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);if(!ok)prompt('自动复制失败，请长按复制：',t);return Promise.resolve();}
function show(m){toast.textContent=m;toast.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('on'),1100);}
let REAL=null;   
function measureGlyphs(){
  const S=32;
  const cv=document.createElement('canvas'); cv.width=S; cv.height=S;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const set=[];
  for(const c of CPS){
    if(c<0x21||(c>=0xD800&&c<=0xDFFF))continue;
    const ch=String.fromCodePoint(c);
    ctx.clearRect(0,0,S,S);
    ctx.font=S+'px WT, monospace';
    ctx.textBaseline='top';
    ctx.fillStyle='#000';
    ctx.fillText(ch,0,0);
    const d=ctx.getImageData(0,0,S,S).data;
    let ink=0;
    for(let i=3;i<d.length;i+=4){ if(d[i]>8){ ink++; if(ink>3) break; } }
    if(ink>3) set.push(c);   
  }
  return set;
}

function render(q){
  if(!REAL) REAL=measureGlyphs();
  q=(q||'').trim().toUpperCase();
  const frag=document.createDocumentFragment();
  let n=0;
  for(const c of REAL){
    const hex=c.toString(16).toUpperCase().padStart(4,'0');
    if(q&&!hex.includes(q))continue;
    const ch=String.fromCodePoint(c);
    const el=document.createElement('div');el.className='cell';
    el.innerHTML='<div class="g">'+ch+'</div><div class="u">'+hex+'</div>';
    el.onclick=()=>copyText(ch).then(()=>show('已复制 '+ch+'  U+'+hex));

    frag.appendChild(el);n++;
  }
  grid.innerHTML='';grid.appendChild(frag);
  info.textContent='共 '+n+' 个符号 · 单击复制 · 双击拼装';
